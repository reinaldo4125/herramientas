<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#orangeGrad)" stroke-width="16" stroke-opacity="0.9"/>

  <!-- Toolbox Graphic -->
  <g id="toolbox">
    <!-- Toolbox Handle -->
    <path d="M 196 130 C 196 95, 220 80, 256 80 C 292 80, 316 95, 316 130 L 316 150 L 196 150 Z" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Toolbox Lid -->
    <rect x="96" y="150" width="320" height="68" rx="14" fill="#334155" stroke="#f8fafc" stroke-width="14"/>
    <circle cx="140" cy="184" r="10" fill="#94a3b8"/>
    <circle cx="372" cy="184" r="10" fill="#94a3b8"/>

    <!-- Toolbox Body -->
    <path d="M 108 218 L 404 218 L 388 392 C 386 410, 372 424, 354 424 L 158 424 C 140 424, 126 410, 124 392 Z" fill="#1e293b" stroke="#f8fafc" stroke-width="14" stroke-linejoin="round"/>

    <!-- Latches -->
    <rect x="168" y="206" width="36" height="50" rx="8" fill="#f8fafc"/>
    <rect x="308" y="206" width="36" height="50" rx="8" fill="#f8fafc"/>
    
    <!-- Horizontal Detail Line -->
    <line x1="130" y1="300" x2="382" y2="300" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Electric Diagnostic Bolt (Herramientas Pro) -->
  <polygon points="360,70 240,250 315,250 220,440 395,210 320,210" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
